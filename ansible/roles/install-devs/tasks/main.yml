---

- name: Install openjdk on fedora 41-
  dnf:
    name:
      - "java-{{ item }}-openjdk"
      - "java-{{ item }}-openjdk-src"
      - "java-{{ item }}-openjdk-devel"
    state: latest
  loop: "{{ oldopenjdkversions }}"
  when: ansible_distribution == "Fedora" and
        ansible_distribution_version is version('41', '<=')

- name: Install openjdk on fedora 42+
  dnf:
    name:
      - "java-{{ item }}-openjdk"
      - "java-{{ item }}-openjdk-src"
      - "java-{{ item }}-openjdk-devel"
    state: latest
  loop: "{{ newopenjdkversions }}"
  when: ansible_distribution == "Fedora" and
        ansible_distribution_version is version('42', '>=')

- name: Install temurin java repo on fedora 42+
  dnf:
    name:
      - "adoptium-temurin-java-repository"
    state: latest
  when: ansible_distribution == "Fedora" and
        ansible_distribution_version is version('42', '>=')
  ignore_errors: true

- name: Install temurin java jdk on fedora 42+
  dnf:
    name:
      - "temurin-{{ item }}-jdk"
    state: latest
  loop: "{{ temurinjdkversions }}"
  when: ansible_distribution == "Fedora" and
        ansible_distribution_version is version('42', '>=')
  ignore_errors: true

- name: Install dev tools
  dnf:
    name: "{{ devtools }}"
    state: latest

- name: Install global npm packages
  npm:
    name: "{{ item }}"
    global: yes
  loop: "{{ npmpkgs }}"

